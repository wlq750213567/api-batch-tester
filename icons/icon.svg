<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 接口清单卡片 -->
  <rect x="104" y="104" width="304" height="304" rx="52"
        fill="#ffffff" fill-opacity="0.13"
        stroke="#ffffff" stroke-opacity="0.45" stroke-width="9"/>

  <!-- 三条接口行 -->
  <rect x="146" y="170" width="132" height="24" rx="12" fill="#ffffff"/>
  <rect x="146" y="238" width="180" height="24" rx="12" fill="#ffffff" opacity="0.78"/>
  <rect x="146" y="306" width="104" height="24" rx="12" fill="#ffffff" opacity="0.52"/>

  <!-- 左侧状态点 -->
  <circle cx="146" cy="182" r="0" fill="none"/>
  <circle cx="352" cy="182" r="13" fill="#ffffff" opacity="0.9"/>
  <circle cx="352" cy="250" r="13" fill="#ffffff" opacity="0.55"/>
  <circle cx="352" cy="318" r="13" fill="#ffffff" opacity="0.35"/>

  <!-- 通过标记 -->
  <circle cx="376" cy="376" r="86" fill="url(#ok)" stroke="#ffffff" stroke-width="20"/>
  <path d="M334 378 L366 410 L420 344" fill="none" stroke="#ffffff"
        stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
